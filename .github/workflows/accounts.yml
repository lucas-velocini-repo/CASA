name: Accounts and station access
on:
  pull_request:
  push:
    branches: [main, feature/user-accounts]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: casa_accounts_test
          POSTGRES_USER: casa_test
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casa_test -d casa_accounts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CASA_ENV: test
      PUBLIC_APP_URL: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://casa_test:test_only_password@localhost:5432/casa_accounts_test
      TEST_DATABASE_URL: postgresql+psycopg://casa_test:test_only_password@localhost:5432/casa_accounts_test
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
