services:

  db:
    image: postgres:17
    container_name: casa-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: casa-backend

    environment: &account_environment
      CASA_ENV: ${CASA_ENV:-production}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Gere AUTH_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      "

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  mail-worker:
    build:
      context: ./backend
    container_name: casa-mail-worker
    environment: *account_environment
    command: python -m app.mail_worker
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: casa-frontend

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
  
  caddy:
    image: caddy:2-alpine

    container_name: casa-caddy

    environment:
      CASA_DOMAIN: ${CASA_DOMAIN:?Defina CASA_DOMAIN}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ${CADDY_CONFIG_PATH:-./infra/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_started

    restart: unless-stopped


volumes:
  postgres_data:

  caddy_data:

  caddy_config: